services:
  - type: web
    name: booleangame-blog
    runtime: node
    plan: free
    buildCommand: cd my-app && npm install && npx prisma generate && npm run build
    startCommand: cd my-app && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booleangame-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://booleangame.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: booleangame-db
    plan: free
    databaseName: booleangame
    user: booleangame_user
