<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booleangame - Galaxy Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #6b4ee6;
            --color-primary-light: #a78bfa;
            --color-primary-dark: #2d1b69;
            --color-accent: #c084fc;
            --color-glow: rgba(107, 78, 230, 0.6);
            --rope-width: 40px;
            --rope-height: 80px;
            --planet-transition: 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        /* 星空画布 */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* 中央天体 - 行星 */
        .planet {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #6b4ee6, #2d1b69, #0d0628);
            box-shadow: 
                0 0 60px rgba(107, 78, 230, 0.6),
                0 0 120px rgba(107, 78, 230, 0.3),
                inset -20px -20px 50px rgba(0,0,0,0.5);
            position: relative;
            animation: float 6s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .planet::before {
            content: '';
            position: absolute;
            width: 280px;
            height: 60px;
            border: 2px solid rgba(107, 78, 230, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            box-shadow: 0 0 20px rgba(107, 78, 230, 0.5);
        }

        .planet:hover {
            transform: scale(1.1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* 标题 */
        .title {
            margin-top: 3rem;
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #a78bfa, #c084fc, #e879f9, #a78bfa);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.5);
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* 副标题 */
        .subtitle {
            margin-top: 1rem;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.3em;
        }

        /* 导航链接 */
        .nav {
            margin-top: 3rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-link {
            position: relative;
            padding: 1rem 2rem;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 50px;
            background: rgba(167, 139, 250, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .nav-link:hover {
            border-color: rgba(167, 139, 250, 0.8);
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.4);
            color: #fff;
        }

        .nav-link:hover::before {
            left: 100%;
        }

        /* 状态指示器 */
        .status {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 10px #4ade80;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* 底部小行星带 */
        .asteroid-belt {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            pointer-events: none;
            z-index: 0;
        }

        .asteroid {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: drift 20s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateX(-10px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(calc(100vw + 10px)); opacity: 0; }
        }

        /* ========== T006: 绳子样式 ========== */
        #rope-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #rope-container.dragging {
            cursor: grabbing;
        }

        #rope-knot {
            width: var(--rope-width);
            height: 30px;
            background: linear-gradient(180deg, #8b6914, #a67c00, #8b6914);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(139, 105, 20, 0.5);
            position: relative;
        }

        #rope-knot::before {
            content: '⬇';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            animation: ropeHint 2s ease-in-out infinite;
        }

        @keyframes ropeHint {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.4; }
            50% { transform: translateX(-50%) translateY(5px); opacity: 0.8; }
        }

        #rope-string {
            width: 6px;
            height: calc(var(--rope-height) - 30px);
            background: linear-gradient(90deg, #6b5a14, #a67c00, #6b5a14);
            border-radius: 0 0 3px 3px;
            transition: height 0.1s ease-out;
        }

        /* ========== T007: 太阳系容器样式 ========== */
        #solar-system {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            opacity: 0;
            transform: translateY(-100%);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            pointer-events: none;
            overflow: hidden;
        }

        #solar-system.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* T020: 太阳 */
        #sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            margin: -40px 0 0 -40px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff7ad, #ffa500, #ff4500);
            box-shadow: 
                0 0 40px rgba(255, 165, 0, 0.8),
                0 0 80px rgba(255, 69, 0, 0.5),
                0 0 120px rgba(255, 165, 0, 0.3);
            animation: sunGlow 3s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes sunGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 165, 0, 0.8), 0 0 80px rgba(255, 69, 0, 0.5); }
            50% { box-shadow: 0 0 60px rgba(255, 165, 0, 1), 0 0 100px rgba(255, 69, 0, 0.7); }
        }

        /* T015: 行星样式 */
        .solar-planet {
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 50%;
            cursor: pointer;
            transition: box-shadow 0.2s ease;
            z-index: 5;
            will-change: transform; /* 修复：提示浏览器优化 transform */
        }

        .solar-planet:hover {
            z-index: 20;
            filter: brightness(1.3);
        }

        /* 行星轨道线 */
        .orbit-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ========== T008: 参数面板样式 ========== */
        #planet-panel {
            position: fixed;
            top: 50%;
            right: 40px;
            transform: translateY(-50%) translateX(120%);
            width: 300px;
            background: rgba(10, 5, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(107, 78, 230, 0.4);
            border-radius: 16px;
            padding: 28px;
            z-index: 200;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 40px rgba(107, 78, 230, 0.2);
        }

        #planet-panel.open {
            transform: translateY(-50%) translateX(0);
        }

        #planet-panel .panel-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        #planet-panel .panel-close:hover {
            color: #fff;
        }

        #planet-panel .panel-planet-name {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--color-primary-light), var(--color-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #planet-panel .panel-planet-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 16px;
            box-shadow: 0 0 20px var(--color-glow);
        }

        #planet-panel .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        #planet-panel .panel-row:last-child {
            border-bottom: none;
        }

        #planet-panel .panel-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.05em;
        }

        #planet-panel .panel-value {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        /* T028: 收起按钮 */
        #collapse-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 150;
            background: rgba(107, 78, 230, 0.2);
            border: 1px solid rgba(107, 78, 230, 0.4);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s, transform 0.3s, background 0.2s;
            pointer-events: none;
        }

        #collapse-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #collapse-btn:hover {
            background: rgba(107, 78, 230, 0.4);
        }

        /* ========== T024-T025: 响应式 ========== */
        @media (max-width: 768px) {
            .title { font-size: 2rem; letter-spacing: 0.3em; }
            .planet { width: 150px; height: 150px; }
            .planet::before { width: 210px; height: 45px; }
            .nav { gap: 1rem; }
            .nav-link { padding: 0.8rem 1.5rem; }

            :root {
                --rope-width: 30px;
                --rope-height: 60px;
            }

            #sun {
                width: 50px;
                height: 50px;
                margin: -25px 0 0 -25px;
            }

            #planet-panel {
                top: auto;
                bottom: 0;
                right: 0;
                left: 0;
                width: 100%;
                border-radius: 16px 16px 0 0;
                transform: translateY(100%);
            }

            #planet-panel.open {
                transform: translateY(0);
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            :root {
                --rope-width: 35px;
                --rope-height: 70px;
            }

            #sun {
                width: 65px;
                height: 65px;
                margin: -32px 0 0 -32px;
            }
        }
    </style>
</head>
<body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    
    <!-- T003: 绳子 HTML -->
    <div id="rope-container" role="slider" aria-label="下拉显示太阳系" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div id="rope-knot"></div>
        <div id="rope-string"></div>
    </div>

    <!-- T028: 收起按钮 -->
    <button id="collapse-btn" aria-label="收起太阳系">✕ 收起</button>

    <!-- T004: 太阳系容器 HTML -->
    <div id="solar-system" role="region" aria-label="太阳系交互模型">
        <div id="sun"></div>
        <!-- 行星和轨道由 JS 动态生成 -->
    </div>

    <!-- T005: 参数面板 HTML -->
    <div id="planet-panel" role="dialog" aria-label="行星参数" aria-hidden="true">
        <button class="panel-close" aria-label="关闭面板">&times;</button>
        <div class="panel-planet-icon" id="panel-icon"></div>
        <div class="panel-planet-name" id="panel-name"></div>
        <div class="panel-row">
            <span class="panel-label">直径</span>
            <span class="panel-value" id="panel-diameter"></span>
        </div>
        <div class="panel-row">
            <span class="panel-label">距太阳</span>
            <span class="panel-value" id="panel-distance"></span>
        </div>
        <div class="panel-row">
            <span class="panel-label">公转周期</span>
            <span class="panel-value" id="panel-orbital"></span>
        </div>
        <div class="panel-row">
            <span class="panel-label">卫星数</span>
            <span class="panel-value" id="panel-moons"></span>
        </div>
        <div class="panel-row">
            <span class="panel-label">表面温度</span>
            <span class="panel-value" id="panel-temp"></span>
        </div>
    </div>

    <div class="container">
        <div class="planet" onclick="warpSpeed()"></div>
        
        <h1 class="title">booleangame</h1>
        <p class="subtitle">探索未知的宇宙边界</p>
        
        <nav class="nav">
            <a href="#" class="nav-link">星图</a>
            <a href="#" class="nav-link">数据</a>
            <a href="#" class="nav-link">日志</a>
            <a href="#" class="nav-link">关于</a>
        </nav>
        
        <div class="status">
            <span class="status-dot"></span>
            <span>系统在线 | 深空探测中</span>
        </div>
    </div>
    
    <div class="asteroid-belt" id="asteroidBelt" aria-hidden="true"></div>

    <script>
        // ========== T002: 行星数据结构 ==========
        const PLANETS = [
            {
                name: '水星',
                nameEn: 'Mercury',
                diameter: 4879,
                distance: 57.9,
                orbitalPeriod: 88,
                moons: 0,
                temperature: '-180°C ~ 430°C',
                color: '#b5b5b5',
                size: 8,
                orbitRadius: 65
            },
            {
                name: '金星',
                nameEn: 'Venus',
                diameter: 12104,
                distance: 108.2,
                orbitalPeriod: 225,
                moons: 0,
                temperature: '462°C（平均）',
                color: '#e8cda0',
                size: 12,
                orbitRadius: 95
            },
            {
                name: '地球',
                nameEn: 'Earth',
                diameter: 12742,
                distance: 149.6,
                orbitalPeriod: 365,
                moons: 1,
                temperature: '15°C（平均）',
                color: '#4a90d9',
                size: 13,
                orbitRadius: 130
            },
            {
                name: '火星',
                nameEn: 'Mars',
                diameter: 6779,
                distance: 227.9,
                orbitalPeriod: 687,
                moons: 2,
                temperature: '-65°C（平均）',
                color: '#c1440e',
                size: 10,
                orbitRadius: 170
            },
            {
                name: '木星',
                nameEn: 'Jupiter',
                diameter: 139820,
                distance: 778.5,
                orbitalPeriod: 4333,
                moons: 95,
                temperature: '-110°C（云层）',
                color: '#c88b3a',
                size: 28,
                orbitRadius: 220
            },
            {
                name: '土星',
                nameEn: 'Saturn',
                diameter: 116460,
                distance: 1434,
                orbitalPeriod: 10759,
                moons: 146,
                temperature: '-140°C（云层）',
                color: '#e8d5a3',
                size: 24,
                orbitRadius: 280
            },
            {
                name: '天王星',
                nameEn: 'Uranus',
                diameter: 50724,
                distance: 2871,
                orbitalPeriod: 30687,
                moons: 27,
                temperature: '-195°C（云层）',
                color: '#72b5c4',
                size: 18,
                orbitRadius: 335
            },
            {
                name: '海王星',
                nameEn: 'Neptune',
                diameter: 49244,
                distance: 4495,
                orbitalPeriod: 60190,
                moons: 16,
                temperature: '-200°C（云层）',
                color: '#3b5bdb',
                size: 17,
                orbitRadius: 380
            }
        ];

        // ========== 星空背景 ==========
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let stars = [];
        let warpMode = false;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        function createStars() {
            stars = [];
            const count = Math.floor((width * height) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.1,
                    brightness: Math.random(),
                    twinkle: Math.random() * 0.02 + 0.01
                });
            }
        }
        
        function drawStars() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            stars.forEach(star => {
                star.brightness += star.twinkle;
                if (star.brightness > 1 || star.brightness < 0.3) {
                    star.twinkle = -star.twinkle;
                }
                
                const alpha = Math.max(0.2, Math.min(1, star.brightness));
                
                if (warpMode) {
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const dx = star.x - centerX;
                    const dy = star.y - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.lineWidth = star.size;
                    ctx.moveTo(star.x, star.y);
                    ctx.lineTo(
                        star.x - Math.cos(angle) * dist * 0.1,
                        star.y - Math.sin(angle) * dist * 0.1
                    );
                    ctx.stroke();
                    
                    star.x += Math.cos(angle) * star.speed * 20;
                    star.y += Math.sin(angle) * star.speed * 20;
                    
                    if (star.x < 0 || star.x > width || star.y < 0 || star.y > height) {
                        star.x = centerX + (Math.random() - 0.5) * 100;
                        star.y = centerY + (Math.random() - 0.5) * 100;
                    }
                } else {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                    
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
            });
            
            requestAnimationFrame(drawStars);
        }
        
        function warpSpeed() {
            warpMode = !warpMode;
            document.querySelector('.title').textContent = warpMode ? '曲速航行中...' : 'booleangame';
            setTimeout(() => {
                warpMode = false;
                document.querySelector('.title').textContent = 'booleangame';
                createStars();
            }, 3000);
        }
        
        function createAsteroids() {
            const belt = document.getElementById('asteroidBelt');
            for (let i = 0; i < 30; i++) {
                const asteroid = document.createElement('div');
                asteroid.className = 'asteroid';
                asteroid.style.top = Math.random() * 100 + 'px';
                asteroid.style.animationDelay = Math.random() * 20 + 's';
                asteroid.style.animationDuration = (15 + Math.random() * 10) + 's';
                belt.appendChild(asteroid);
            }
        }

        // ========== T015: 创建行星 DOM ==========
        function createSolarSystem() {
            const container = document.getElementById('solar-system');
            
            PLANETS.forEach((planet, index) => {
                // 轨道环
                const ring = document.createElement('div');
                ring.className = 'orbit-ring';
                const ringSize = planet.orbitRadius * 2;
                ring.style.width = ringSize + 'px';
                ring.style.height = ringSize + 'px';
                ring.style.marginLeft = -planet.orbitRadius + 'px';
                ring.style.marginTop = -planet.orbitRadius + 'px';
                container.appendChild(ring);

                // 行星
                const el = document.createElement('div');
                el.className = 'solar-planet';
                el.setAttribute('role', 'button');
                el.setAttribute('aria-label', planet.name + ' - 点击查看参数');
                el.setAttribute('tabindex', '0');
                el.dataset.planetIndex = index;
                el.style.width = planet.size + 'px';
                el.style.height = planet.size + 'px';
                el.style.background = `radial-gradient(circle at 35% 35%, ${lightenColor(planet.color, 40)}, ${planet.color}, ${darkenColor(planet.color, 40)})`;
                el.style.boxShadow = `0 0 ${planet.size / 2}px ${planet.color}66, inset -${planet.size/6}px -${planet.size/6}px ${planet.size/3}px rgba(0,0,0,0.4)`;
                container.appendChild(el);

                // 土星光环
                if (planet.nameEn === 'Saturn') {
                    const ring3d = document.createElement('div');
                    ring3d.style.cssText = `
                        position: absolute;
                        width: ${planet.size * 1.8}px;
                        height: ${planet.size * 0.5}px;
                        border: 2px solid rgba(232, 213, 163, 0.4);
                        border-radius: 50%;
                        pointer-events: none;
                    `;
                    el.appendChild(ring3d);
                }
            });
        }

        // ========== T021-T022: 轨道动画 ==========
        let animationFrameId = null;
        let planetAngles = PLANETS.map(() => Math.random() * Math.PI * 2);
        let lastTime = 0;
        let orbitScale = Math.min(window.innerWidth, window.innerHeight) / 850;

        // 修复：使用 transform 代替 left/top，减少重排
        function animateOrbits(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            const planets = document.querySelectorAll('.solar-planet');
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;

            planets.forEach((el, i) => {
                const planet = PLANETS[i];
                // 轨道速度：越远越慢（与实际公转周期成反比）
                const speed = (365 / planet.orbitalPeriod) * 0.5;
                planetAngles[i] += speed * dt;

                const r = planet.orbitRadius * orbitScale;
                const x = cx + Math.cos(planetAngles[i]) * r - planet.size / 2;
                const y = cy + Math.sin(planetAngles[i]) * r - planet.size / 2;

                // 修复：使用 transform 触发 GPU 加速，避免重排
                el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            });

            animationFrameId = requestAnimationFrame(animateOrbits);
        }

        // ========== T009-T014: 绳子交互 ==========
        const ropeContainer = document.getElementById('rope-container');
        const ropeString = document.getElementById('rope-string');
        const solarSystem = document.getElementById('solar-system');
        const collapseBtn = document.getElementById('collapse-btn');

        let isDragging = false;
        let startY = 0;
        let pullProgress = 0;
        let solarVisible = false;
        let rafId = null; // 修复：添加 RAF 节流

        function getClientY(e) {
            return e.touches ? e.touches[0].clientY : e.clientY;
        }

        function onStart(e) {
            if (solarVisible) return;
            isDragging = true;
            startY = getClientY(e);
            ropeContainer.classList.add('dragging');
            e.preventDefault();
        }

        function onMove(e) {
            if (!isDragging || rafId) return;
            rafId = requestAnimationFrame(() => {
                rafId = null;
                const currentY = getClientY(e);
                const diff = currentY - startY;
                const maxPull = window.innerHeight * 0.4;
                pullProgress = Math.max(0, Math.min(1, diff / maxPull));

                // 更新绳子长度（缓存基础高度避免重复读取）
                const baseHeight = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--rope-height'));
                ropeString.style.height = (baseHeight - 30 + diff * 0.5) + 'px';

                // 实时更新太阳系透明度作为预览
                solarSystem.style.opacity = pullProgress * 0.5;

                // 更新 aria
                ropeContainer.setAttribute('aria-valuenow', Math.round(pullProgress * 100));
            });
            e.preventDefault();
        }

        function onEnd() {
            if (!isDragging) return;
            isDragging = false;
            ropeContainer.classList.remove('dragging');

            // 修复：直接使用视口高度的 30% 作为阈值
            const threshold = window.innerHeight * 0.3;
            const currentY = parseFloat(ropeString.style.height) || parseInt(getComputedStyle(document.documentElement).getPropertyValue('--rope-height'));
            const pulledDistance = currentY - (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--rope-height')) - 30);

            if (pulledDistance > threshold) {
                showSolarSystem();
            } else {
                hideSolarSystem();
            }

            // 重置绳子
            ropeString.style.height = '';
            pullProgress = 0;
        }

        function showSolarSystem() {
            solarVisible = true;
            solarSystem.classList.add('visible');
            solarSystem.style.opacity = '';
            collapseBtn.classList.add('visible');
            if (!animationFrameId) {
                lastTime = 0;
                animationFrameId = requestAnimationFrame(animateOrbits);
            }
        }

        function hideSolarSystem() {
            solarVisible = false;
            solarSystem.classList.remove('visible');
            solarSystem.style.opacity = '';
            collapseBtn.classList.remove('visible');
            closePanel();
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        // 绳子事件绑定
        ropeContainer.addEventListener('mousedown', onStart);
        ropeContainer.addEventListener('touchstart', onStart, { passive: false });
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchend', onEnd);

        // 键盘支持
        ropeContainer.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                if (solarVisible) hideSolarSystem();
                else showSolarSystem();
            }
        });

        // 收起按钮
        collapseBtn.addEventListener('click', hideSolarSystem);

        // ========== T016-T018: 行星点击 + 参数面板 ==========
        const panel = document.getElementById('planet-panel');
        const panelClose = panel.querySelector('.panel-close');

        function openPanel(index) {
            const planet = PLANETS[index];
            document.getElementById('panel-icon').style.background = `radial-gradient(circle at 35% 35%, ${lightenColor(planet.color, 40)}, ${planet.color})`;
            document.getElementById('panel-name').textContent = planet.name + ' ' + planet.nameEn;
            document.getElementById('panel-diameter').textContent = planet.diameter.toLocaleString() + ' km';
            document.getElementById('panel-distance').textContent = planet.distance.toLocaleString() + ' 百万km';
            document.getElementById('panel-orbital').textContent = planet.orbitalPeriod.toLocaleString() + ' 天';
            document.getElementById('panel-moons').textContent = planet.moons;
            document.getElementById('panel-temp').textContent = planet.temperature;
            panel.classList.add('open');
            panel.setAttribute('aria-hidden', 'false');
        }

        function closePanel() {
            panel.classList.remove('open');
            panel.setAttribute('aria-hidden', 'true');
        }

        // 行星点击事件委托
        document.getElementById('solar-system').addEventListener('click', (e) => {
            const planetEl = e.target.closest('.solar-planet');
            if (planetEl) {
                openPanel(parseInt(planetEl.dataset.planetIndex));
            }
        });

        // 行星键盘支持
        document.getElementById('solar-system').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                const planetEl = e.target.closest('.solar-planet');
                if (planetEl) {
                    e.preventDefault();
                    openPanel(parseInt(planetEl.dataset.planetIndex));
                }
            }
        });

        // 关闭面板
        panelClose.addEventListener('click', closePanel);
        document.addEventListener('click', (e) => {
            if (panel.classList.contains('open') && !panel.contains(e.target) && !e.target.closest('.solar-planet')) {
                closePanel();
            }
        });

        // ESC 关闭面板
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePanel();
        });

        // ========== 工具函数 ==========
        function lightenColor(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        function darkenColor(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, (num >> 16) - amt);
            const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
            const B = Math.max(0, (num & 0x0000FF) - amt);
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        // ========== 初始化 ==========
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                resize();
                createStars();
                orbitScale = Math.min(window.innerWidth, window.innerHeight) / 850;
            }, 100);
        });
        
        resize();
        createStars();
        drawStars();
        createAsteroids();
        createSolarSystem();
    </script>
</body>
</html>
