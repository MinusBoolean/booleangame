<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booleangame - Galaxy Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        /* 星空画布 */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* 中央天体 - 行星 */
        .planet {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #6b4ee6, #2d1b69, #0d0628);
            box-shadow: 
                0 0 60px rgba(107, 78, 230, 0.6),
                0 0 120px rgba(107, 78, 230, 0.3),
                inset -20px -20px 50px rgba(0,0,0,0.5);
            position: relative;
            animation: float 6s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .planet::before {
            content: '';
            position: absolute;
            width: 280px;
            height: 60px;
            border: 2px solid rgba(107, 78, 230, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            box-shadow: 0 0 20px rgba(107, 78, 230, 0.5);
        }

        .planet:hover {
            transform: scale(1.1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* 标题 */
        .title {
            margin-top: 3rem;
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #a78bfa, #c084fc, #e879f9, #a78bfa);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.5);
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* 副标题 */
        .subtitle {
            margin-top: 1rem;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.3em;
        }

        /* 导航链接 */
        .nav {
            margin-top: 3rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-link {
            position: relative;
            padding: 1rem 2rem;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 50px;
            background: rgba(167, 139, 250, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .nav-link:hover {
            border-color: rgba(167, 139, 250, 0.8);
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.4);
            color: #fff;
        }

        .nav-link:hover::before {
            left: 100%;
        }

        /* 状态指示器 */
        .status {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 10px #4ade80;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* 底部小行星带 */
        .asteroid-belt {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            pointer-events: none;
            z-index: 0;
        }

        .asteroid {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: drift 20s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateX(-10px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(calc(100vw + 10px)); opacity: 0; }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .title { font-size: 2rem; letter-spacing: 0.3em; }
            .planet { width: 150px; height: 150px; }
            .planet::before { width: 210px; height: 45px; }
            .nav { gap: 1rem; }
            .nav-link { padding: 0.8rem 1.5rem; }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    
    <div class="container">
        <div class="planet" onclick="warpSpeed()"></div>
        
        <h1 class="title">booleangame</h1>
        <p class="subtitle">探索未知的宇宙边界</p>
        
        <nav class="nav">
            <a href="#" class="nav-link">星图</a>
            <a href="#" class="nav-link">数据</a>
            <a href="#" class="nav-link">日志</a>
            <a href="#" class="nav-link">关于</a>
        </nav>
        
        <div class="status">
            <span class="status-dot"></span>
            <span>系统在线 | 深空探测中</span>
        </div>
    </div>
    
    <div class="asteroid-belt" id="asteroidBelt"></div>

    <script>
        // 星空背景
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let stars = [];
        let warpMode = false;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        function createStars() {
            stars = [];
            const count = Math.floor((width * height) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.1,
                    brightness: Math.random(),
                    twinkle: Math.random() * 0.02 + 0.01
                });
            }
        }
        
        function drawStars() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            stars.forEach(star => {
                // 闪烁效果
                star.brightness += star.twinkle;
                if (star.brightness > 1 || star.brightness < 0.3) {
                    star.twinkle = -star.twinkle;
                }
                
                const alpha = Math.max(0.2, Math.min(1, star.brightness));
                
                if (warpMode) {
                    // 曲速效果
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const dx = star.x - centerX;
                    const dy = star.y - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.lineWidth = star.size;
                    ctx.moveTo(star.x, star.y);
                    ctx.lineTo(
                        star.x - Math.cos(angle) * dist * 0.1,
                        star.y - Math.sin(angle) * dist * 0.1
                    );
                    ctx.stroke();
                    
                    star.x += Math.cos(angle) * star.speed * 20;
                    star.y += Math.sin(angle) * star.speed * 20;
                    
                    if (star.x < 0 || star.x > width || star.y < 0 || star.y > height) {
                        star.x = centerX + (Math.random() - 0.5) * 100;
                        star.y = centerY + (Math.random() - 0.5) * 100;
                    }
                } else {
                    // 正常星空
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                    
                    // 缓慢移动
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
            });
            
            requestAnimationFrame(drawStars);
        }
        
        // 曲速模式
        function warpSpeed() {
            warpMode = !warpMode;
            document.querySelector('.title').textContent = warpMode ? '曲速航行中...' : 'booleangame';
            setTimeout(() => {
                warpMode = false;
                document.querySelector('.title').textContent = 'booleangame';
                createStars();
            }, 3000);
        }
        
        // 小行星带
        function createAsteroids() {
            const belt = document.getElementById('asteroidBelt');
            for (let i = 0; i < 30; i++) {
                const asteroid = document.createElement('div');
                asteroid.className = 'asteroid';
                asteroid.style.top = Math.random() * 100 + 'px';
                asteroid.style.animationDelay = Math.random() * 20 + 's';
                asteroid.style.animationDuration = (15 + Math.random() * 10) + 's';
                belt.appendChild(asteroid);
            }
        }
        
        // 初始化
        window.addEventListener('resize', () => {
            resize();
            createStars();
        });
        
        resize();
        createStars();
        drawStars();
        createAsteroids();
    </script>
</body>
</html>
